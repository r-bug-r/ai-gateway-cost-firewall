[project]
name = "ai-gateway-cost-firewall"
version = "0.1.0"
description = "Self-hostable OpenAI-compatible gateway that enforces spend budgets, routes providers, and redacts secrets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.151.0",
  "httpx==0.28.1",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.3",
  "ruff==0.14.3",
]

[project.scripts]
cost-firewall = "cost_firewall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_firewall"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: exercises real sockets or subprocesses"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "tests"]
explicit_package_bases = true
files = ["src", "tests", "scripts"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
