name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Audit pinned dependencies
        run: |
          python -m pip install pip-audit
          python -m pip freeze --exclude-editable > requirements-audit.txt
          python -m pip_audit -r requirements-audit.txt --strict

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$archive" -o "/tmp/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          expected=$(grep " $archive$" /tmp/gitleaks_checksums.txt | awk '{print $1}')
          actual=$(sha256sum "/tmp/$archive" | awk '{print $1}')
          test -n "$expected" && test "$expected" = "$actual"
          tar -xzf "/tmp/$archive" -C /tmp gitleaks

      # Scan every commit rather than the event's diff: a newly created branch has no
      # parent for the first commit, and full history is the stronger guarantee anyway.
      - name: Scan history for credentials
        run: |
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact -v \
            --report-format=sarif --report-path=gitleaks.sarif --exit-code=2

      - name: Upload findings
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
